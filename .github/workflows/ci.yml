name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # The ext4 tests validate every write with e2fsck. Without it they skip,
      # so Linux is the only runner that exercises the filesystem writer.
      - name: Install e2fsprogs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs

      - run: gofmt -l . | tee /tmp/fmt.txt && test ! -s /tmp/fmt.txt
        shell: bash
        if: runner.os == 'Linux'
      - run: go vet ./...
      - run: go test -v ./...

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build all targets
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -ldflags="-s -w" \
              -o "dist/flexpack-$os-$arch$ext" .
          done
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
